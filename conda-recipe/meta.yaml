{% set name = "mlx-edge" %}
{% set version = "0.8.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mlx-edge = mlx_edge.cli:main
    - edge-gui = mlx_edge.cli:gui_main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - pip
    - git
    - mlx
    - mlx-lm
    - mlx-vlm

test:
  imports:
    - mlx_edge
  commands:
    - mlx-edge --help
    - mlx-edge engines
    - mlx-edge status --offline
    - edge-gui --help

about:
  home: https://github.com/milljm/bleeding-edge-mlx-server
  license: MIT
  license_file: LICENSE
  summary: OpenAI /v1 gateway for mlx-lm / mlx-vlm / embeddings with a local Edge GUI.
  description: |
    mlx-edge hot-loads mlx-lm, mlx-vlm, and embedding models on one host/port.
    edge-gui serves the studio that drives load/unload. Compiled mlx stays on a wheel.
  doc_url: https://github.com/milljm/bleeding-edge-mlx-server
  dev_url: https://github.com/milljm/bleeding-edge-mlx-server

extra:
  recipe-maintainers:
    - milljm
