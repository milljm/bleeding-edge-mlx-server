{% set name = "mlx-edge" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mlx-edge = mlx_edge.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - pip
    - git

test:
  imports:
    - mlx_edge
  commands:
    - mlx-edge --help
    - mlx-edge engines
    - mlx-edge status --offline

about:
  home: https://github.com/milljm/bleeding-edge-mlx-server
  license: MIT
  license_file: LICENSE
  summary: Hot-load mlx-lm and mlx-vlm onto one OpenAI /v1 gateway.
  description: |
    mlx-edge is a local OpenAI-compatible gateway. It keeps compiled mlx on a
    wheel or conda-forge, overlays git HEAD of mlx-lm / mlx-vlm, and hot-loads
    several models side by side on one host/port.
  doc_url: https://github.com/milljm/bleeding-edge-mlx-server
  dev_url: https://github.com/milljm/bleeding-edge-mlx-server

extra:
  recipe-maintainers:
    - milljm
