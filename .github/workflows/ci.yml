name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install .
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: cli smoke
        run: |
          mlx-edge --help
          mlx-edge engines
          mlx-edge status --offline
          mlx-edge which
